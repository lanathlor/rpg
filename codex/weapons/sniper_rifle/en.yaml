name: Sniper rifle
category: Ranged weapon
subcategory: two-handed weapon
type: sniper
cost: 2200 credits
prerequisites:
  affinity: A. sniper 1
stats:
  damage: 2d8
  attack_type: ranged attack (PRE)
  defense_type: parry (STR)
special_effects:
  - X2 on precision roll
  - 1/20 chance to hit at less than 10 meters
description: Masterpiece of imperial ballistic engineering, this long-barreled precision rifle is equipped with advanced targeting optics and a gyroscopic stabilization system. Designed to eliminate targets at distances where the enemy cannot even suspect the shooter's presence. Its considerable weight and length make it completely unsuitable for close-range engagements, requiring thoughtful tactical positioning.
