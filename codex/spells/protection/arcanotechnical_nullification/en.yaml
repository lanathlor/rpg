spell_series: Arcanotechnical Nullification
description_base: Disperses or cancels active arcanotechnical effects.
levels:
  - level: "1"
    name: Arcanotechnical Nullification
    prerequisites:
      affinities:
        école_requirement: "A.École[pure]: 2"
        type_requirement: "A.Type[protection]: 2"
        mixed_requirement: "A.École[pure] + A.Type[protection]: 6"
    conditions:
      intelligence_required: 17
      flux_cost: 5
    effects:
      special: Cancels an active arcanotechnical effect on a target
      specials:
        - Restores 1d4 flux points to the caster
        - +2 to arcanotechnical resistance for 3 turns
  - level: "2"
    name: Greater Arcanotechnical Nullification
    prerequisites:
      affinities:
        école_requirement: "A.École[pure]: 3"
        type_requirement: "A.Type[protection]: 3"
        mixed_requirement: "A.École[pure] + A.Type[protection]: 9"
    conditions:
      intelligence_required: 19
      flux_cost: 8
    effects:
      special: Cancels all arcanotechnical effects on the target
      specials:
        - Restores 2d4 flux points to the caster
        - +3 to arcanotechnical resistance for 5 turns
        - Creates an anti-arcanotechnical zone with a 3m radius for 2 turns
