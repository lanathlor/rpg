spell_series: Knowledge Sharing
description_base: You share your arcanotechnical knowledge through the Flux, allowing a target to benefit from it to act optimally.
levels:
  - level: "1"
    name: Knowledge Sharing
    prerequisites:
      affinities:
        école_requirement: "A.École[bioarcanotechnique]: 3"
        type_requirement: "A.Type[amelioration]: 3"
        mixed_requirement: "A.École[bioarcanotechnique] + A.Type[amelioration]: 9"
    conditions:
      intelligence_required: 15
      flux_cost: 6
    effects:
      special: "Rank-up the next die used by the target (excluding damage rolls) according to the hierarchy: d4->d6->d8->d10->d12->d20->d20+d8"
    duration: 1 turn
