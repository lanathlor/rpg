spell_series: Weak Point Strike
description_base: Targets the opponent's weak points to maximize damage.
levels:
  - level: "1"
    name: Weak Point Strike
    prerequisites:
      affinities:
        école_requirement: "A.École[martial]: 3"
        type_requirement: "A.Type[arme]: 3"
        mixed_requirement: "A.École[martial] + A.Type[arme]: 9"
    conditions:
      dexterity_required: 14
    recharge_time: 5 turns
    effects:
      damage: +1d8+3 to weapon damage
      resistance: RMEC
      critical_chance: Critical on 19-20
  - level: "2"
    name: Weak Point Strike II
    prerequisites:
      affinities:
        école_requirement: "A.École[martial]: 4"
        type_requirement: "A.Type[arme]: 4"
