spell_series: Hallucinogenic Spores
description_base: Releases a cloud of bioarcanotechnical spores causing hallucinations in those who breathe them.
levels:
  - level: "1"
    name: Hallucinogenic Spores
    prerequisites:
      affinities:
        école_requirement: "A.École[bioarcanotechnique]: 4"
        type_requirement: "A.Type[affliction]: 3"
        mixed_requirement: "A.École[bioarcanotechnique] + A.Type[affliction]: 10"
    conditions:
      intelligence_required: 14
      flux_cost: 10
    effects:
      area: 5m radius zone
      resistance: RINT
      debuff: "Applies Hallucinating to targets in the area"
      special: "Affected targets must attack the nearest creature (ally or enemy) for 3 turns"
      duration: 3 turns
    timing:
      casting_time: 1 action
      duration: 3 turns
      range: 15m
  - level: "2"
    name: Greater Hallucinogenic Spores
    prerequisites:
      affinities:
        école_requirement: "A.École[bioarcanotechnique]: 7"
        type_requirement: "A.Type[affliction]: 5"
        mixed_requirement: "A.École[bioarcanotechnique] + A.Type[affliction]: 15"
    conditions:
      intelligence_required: 16
      flux_cost: 15
    effects:
      area: 8m radius zone
      resistance: RINT
      debuff: "Applies Hallucinating and Weakened 3 to targets in the area"
      damage: 1d6 per turn
      special: "Affected targets must attack the nearest creature for 5 turns"
      duration: 5 turns
    timing:
      casting_time: 1 action
      duration: 5 turns
      range: 20m
