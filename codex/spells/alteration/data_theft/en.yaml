spell_series: Data Theft
description_base: Steals data from the target.
levels:
  - level: "1"
    name: Data Theft
    prerequisites:
      affinities:
        école_requirement: "A.École[illusion]: 2"
        type_requirement: "A.Type[alteration]: 2"
        mixed_requirement: "A.École[illusion] + A.Type[alteration]: 6"
      competences:
        - Hackeur
    conditions:
      perception_required: 15
      flux_cost: 4
    effects:
      information: Retrieves partial information about the target. A better roll increases the amount of information. Repeated rolls on the same target reveal new information.
  - level: "2"
    name: Data Theft II
    prerequisites:
      affinities:
        école_requirement: "A.École[illusion]: 3"
        type_requirement: "A.Type[alteration]: 3"
        mixed_requirement: "A.École[illusion] + A.Type[alteration]: 9"
      competences:
        - Hackeur
    conditions:
      perception_required: 15
      flux_cost: 7
    effects:
      information: Retrieves partial information about the target. A better roll increases the amount of information. Repeated rolls on the same target reveal new information. This spell is more effective than 'Data Theft'.
