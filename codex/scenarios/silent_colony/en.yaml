author: Lanathlor
gm_tips: |
  1. ATMOSPHERE: This is a horror scenario. Use sensory descriptions, strange sounds, oppressive silence. The colony must be frightening.

  2. ZOMBIES: They are not classic "undead." The crystal animates the corpses via the Flux. When the antenna amplifies the signal, they activate. When it shuts down, they collapse.

  3. MENTAL CONTROL: The soldiers are under total control near the crystal. They seem normal but "a bit odd." Let the players be suspicious. Only reveal the betrayal at the dramatic moment.

  4. THE GUARDIAN: This is a DIFFICULT boss (~400 points for a group ~230). It must be a real challenge. Use the environment, regeneration, area attacks. The players must tactically manage this combat.

  5. TWO PATHS: Installation = information and tactical advantages. Forest = direct but without preparation. Both lead to the same place but with different levels of preparation.

  6. THE CRYSTAL: It is EXTREMELY POWERFUL and possesses a rudimentary consciousness.
     - Players sensitive to the Flux feel it from afar (migraines, unease)
     - IMPORTANT: After defeating The Guardian, the crystal SPEAKS to players sensitive to arcanotechnology. It is a mental voice, in an unknown and incomprehensible language. No one can translate. It is deeply disturbing.
     - Touching the crystal or staying near it makes one SICK: nausea, fever, visual/auditory hallucinations, weakness. The longer one stays, the worse it gets.
     - If they try to keep it: progressive corruption, madness, physical changes, and imperial pursuit. CATASTROPHIC consequences.

  7. OPALS AND WHITES - IMPORTANT TIMING:
     - They were ALREADY EN ROUTE before the antenna was cut. Classified secret mission.
     - The Empire KNEW something about this crystal. The installation was not a recently discovered accident.
     - The players DO NOT KNOW this. In their briefing, they think they are the only rescue team.
     - The Opals and Whites arrive a few hours after the resolution, whether successful or not.
     - Impressive arrival: two elite soldiers in white armor with opal symbols. Courteous but firm.
     - If crystal intact: they take it, thank briefly, leave without explanations.
     - If crystal destroyed: they arrive too late, visibly displeased but professional. Question the players about what happened.
     - Mystery for the players: Why did the Empire send its best soldiers? What did they know?

  8. PACING: Act 1 = tension/horror, Act 2 = mystery/exploration, Act 3 = action/boss fight. Vary the pacing.

  9. POSSIBLE FAILURE: The players can fail and flee. That's OK. The Empire will send a larger force. But the players will live with that failure.

  10. NARRATIVE REWARDS: Beyond points/credits, offer clues about the universe. What are these crystals? Why does the Empire keep them secret? Plant seeds for future adventures.
