author: Lanathlor
gm_tips: |
  GM TIPS:

  1. THIS IS A WAR SCENARIO: The atmosphere must be intense. Explosions, gunfire, screams. Describe the chaos of battle.

  2. VEX'KRAL IS A REAL BOSS: Do not underestimate him. He is a formidable combatant (~350 points vs group ~230). The players must use tactics, environment, and teamwork.

  3. POSSIBLE LOSSES: In war, people die. If a player drops to 0 HP, it is serious. Permanent injuries are possible. The danger must be real.

  4. SECONDARY OBJECTIVES: The prisoner camp and communication station are optional but provide tactical advantages. The players must choose: time vs benefits.

  5. SERGEANT THALE: If the players do the sabotage, she can join them. She is a competent allied NPC but not invincible. She can die heroically if necessary.

  6. ACERAS: Disciplined aliens, tacticians, advanced technology. Not stupid monsters. They communicate, coordinate, adapt their tactics.

  7. TACTICAL BOSS FIGHT: The command room has interactive elements. Encourage the players to use the environment (sabotage, explosions, cover).

  8. EXTRACTION: After killing Vex'kral, the imperial offensive begins. Describe the ships in orbit bombarding, the troops landing. It is epic.

  9. COSTLY VICTORY: Even in case of success, the players should be exhausted, wounded, out of ammunition. Military victory has a price.

  10. POSSIBLE SEQUEL: This scenario can launch a war campaign against the Aceras. Helion-IV liberated, but other planets are occupied. The players become an elite squad for similar missions.
