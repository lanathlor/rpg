author: Lanathlor
gm_tips: |
  GM TIPS:

  1. FLEXIBILITY: The players can approach the scenario in multiple ways. Be prepared to improvise.

  2. PACING: If Act 2 drags on, Cipher can directly reveal the location to speed things up.

  3. KANE: He is a pragmatic antagonist, not a fanatic. He can surrender or flee if the situation turns bad.

  4. VEX: She is not a damsel in distress. She can defend herself and has prepared defenses in her lab.

  5. MORAL CHOICE: Do not force a "good" answer. All outcomes have interesting consequences.

  6. ATMOSPHERE: Use descriptions of neons, acid rain, decrepit neighborhoods to reinforce the tech-noir feeling.

  7. BACKUPS: Prepare backup NPCs (e.g., additional witness) in case the players get stuck on the investigation.

  8. TACTICAL COMBAT: Sector 7 offers a lot of cover and elevation. Use the environment.
