author: Lanathlor
gm_tips: |
  GM TIPS:

  1. TIME PRESSURE: Time is the main enemy. Use a visible countdown. Every false lead, every failed interrogation = time lost.

  2. FAILURE IS AN OPTION: This scenario is DESIGNED to be difficult. Do not artificially make it easier. If the players fail, the attack takes place. It is narratively powerful.

  3. EXPLOSION CONSEQUENCES: If the bomb explodes, describe the horror. Dead, wounded, screams. The players must FEEL the failure. But they can still capture the saboteurs and limit the damage.

  4. LOCAL POLICE: Harven Koss is not a villain. He is frustrated, humiliated by the occupation. Play that tension. The players can rally him if they show respect.

  5. LYRA: She is an innocent and vulnerable witness. Do not turn her into a suspect unless the players are really paranoid. She can become an emotional anchor point.

  6. MIRA SARROS: She is a fanatic but not stupid. She sincerely believes the Empire is an oppressor. Give her depth in her dialogue if captured.

  7. PROGRESSIVE CLUES: If the players are stuck, give subtle hints (anonymous call, a witness comes forward). But do NOT give them the solution.

  8. ATMOSPHERE: Rising tension. Countdown music. Descriptions of the festive city unaware of the danger. Contrast between the colorful parade and the dark conspiracy.

  9. IMPERIAL REPRESSION: If the attack succeeds, the Empire will react firmly but methodically. Temporary martial law, reinforced security sweeps, intensive investigations and targeted arrests of suspects. Political pressure on the local government for having "failed to maintain order." The players witness the consequences of their failure and rising tensions.

  10. POSSIBLE SEQUEL: This scenario can launch a campaign. If the attack succeeds, the resistance ignites. The players must dismantle the complete network. If foiled, Mira becomes a martyr, rallying more recruits.
