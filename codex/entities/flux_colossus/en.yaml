name: Flux Colossus
type: Boss / Arcanotechnological Creature
faction: Hostile
alignement: Neutral (controlled by Flux source)
description: Hybrid plant/flesh entity created or transformed by a powerful Flux source. Massive 3-meter-tall humanoid form, roots and flesh fused in grotesque fashion. Greenish luminescent eyes. Possesses advanced bioarcanotechnological and biometabolic capabilities. Implacable guardian of its power source.
