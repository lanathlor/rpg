name: Zombie du Flux
type: Mort-vivant animé / Cadavre contrôlé
faction: Hostile
alignement: hostile
description: Cadavre animé par l'influence d'un cristal de Flux puissant. Lent mais implacable, résistant aux dommages internes mais vulnérable aux dégâts radiants. Ignore les vivants et cherche à éteindre les sources d'interférence électromagnétique.
