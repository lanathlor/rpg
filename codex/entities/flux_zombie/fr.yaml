gameplay_guide: Zombie animé par le Flux. Ignore les joueurs et se dirige vers l'antenne de communication pour l'éteindre. Si empêché, attaque l'obstacle. Lent (Vitesse 2) mais nombreux. Haute résistance interne (RINT +6) car déjà mort. Vulnérable aux dégâts de zone et radiants. Combat corps à corps uniquement (1d6 RMEC).
