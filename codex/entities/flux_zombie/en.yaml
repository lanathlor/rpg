name: Flux Zombie
type: Animated Corpse / Controlled Cadaver
faction: Hostile
alignement: hostile
description: Corpse animated by the influence of a powerful Flux crystal. Slow but relentless, resistant to internal damage but vulnerable to radiant damage. Ignores the living and seeks to extinguish sources of electromagnetic interference.
