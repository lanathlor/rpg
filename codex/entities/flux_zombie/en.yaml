gameplay_guide: Flux-animated zombie. Ignores players and heads toward the communication antenna to shut it down. If blocked, attacks the obstacle. Slow (Speed 2) but numerous. High internal resistance (RINT +6) as already dead. Vulnerable to area damage and radiant damage. Melee combat only (1d6 RMEC).
