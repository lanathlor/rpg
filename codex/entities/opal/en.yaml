description: Opals represent the Elite rank of the imperial army - units capable of single-handedly influencing the course of a battle. Exosoldiers equipped with the most advanced Generation 7 prototype exoskeleton ever designed, they form a strategic strike force deployed only during critical missions. Their training lasts decades, their equipment is worth more than entire starships. Each Opal is a living weapon, capable of accomplishing alone what would normally require a battalion. Their mere presence on a battlefield shifts the balance of power. Few in number, strategically decisive.
