name: Opale
type: Rang Élite / Exosoldat
faction: Empire
alignement: Loyal (envers l'Empire)
description: Les Opales représentent le rang Élite de l'armée impériale - des unités capables d'influencer seules le cours d'une bataille. Exosoldats équipés du prototype d'exosquelette de génération 7 le plus avancé jamais conçu, ils forment une force de frappe stratégique déployée uniquement lors de missions critiques. Leur entraînement dure des décennies, leur équipement vaut plus que des vaisseaux entiers. Chaque Opale est une arme vivante, capable d'accomplir seule ce qui nécessiterait normalement un bataillon. Leur simple présence sur un champ de bataille change l'équilibre des forces. Peu nombreux, stratégiquement décisifs.
