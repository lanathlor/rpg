gameplay_guide: |
  RANG ELITE - ~10 000 POINTS

  Stats base (sans exo): FOR 12 / DEX 16 / CON 15 / INT 18 / PER 18 / PRE 20 / CHA 14
  Flux base: 60 (12/tour, recup 10)

  Stats avec OPAL-XS7: FOR 18 / DEX 20 / CON 20 / INT 18 / PER 21 / PRE 25 / CHA 14
  PV: 180 | Vitesse: 8m/tour
  Flux avec exo: 80 (15/tour, recup 12)
  Resistances totales: RMEC +20 (5+15) / RRAD +16 (4+12) / RINT +16 (8+8)
  SD: vs CaC 24 / vs melee legere 25 / vs distance 27-28 / vs arcano 24

  EXOSQUELETTE XS7 (2M credits, 5000 pts):
  Bonus stats: +6 FOR, +4 DEX, +5 CON, +3 PER, +5 PRE
  Bonus Flux: +20 reserve, +3/tour, +2 recup
  Bonus affinites: +3 distance, +2 balistique/lumiere/electricite/destruction/amelioration
  Bouclier energetique: +5 RRAD 3 tours (1/combat)
  Vision augmentee, survie vide spatial, saut 6m, camouflage 1 tour (3/jour, 10 Flux)

  ARMEMENT:
  Fusil 'Silencieux': 4d8+6 RMEC, portee 2000m, ignore 5 RMEC, bonus +3 PRE/+2 PER/+2 attaque
  Lame 'Eclair': 3d6+8 RMEC, ignore 8 RMEC, bonus +2 FOR/+2 DEX/+2 parades
  - Charge plasmique (8 Flux): +3d6 RRAD | Mode percant: ignore tout RMEC
  Guerrier permet 2 attaques/tour avec chaque arme.

  VULNERABILITES:
  - Signature arcanotechnique massive (exo facilement detectable)
  - Dependance a l'exosquelette (sans: ~5000 pts, vulnerable)
  - Maintenance quotidienne (500 credits/jour)
  - Flux epuisable en combat prolonge

  CONTRE-MESURES:
  Brouillage EM, zone anti-Flux, attaque coordonnee (4+ combattants), armes anti-materiel, drain de Flux (RINT), EMP pour desactiver l'exosquelette, environnement confine.

  NOTE MJ:
  PNJ de tres haut niveau. A utiliser comme allie, antagoniste indirect, ou boss final de campagne. En adversaire direct, reserver aux groupes H-1/H-2 avec preparation importante. Sans exosquelette, reste dangereux mais peut etre vaincu par un groupe coordonne.
notes: "RANG ÉLITE ~10,000 POINTS. Les Opales sont parmi les combattants les plus redoutables de l'Empire. Rang Élite de l'armée - capables d'influencer seules le cours d'une bataille. Leur exosquelette seul vaut plus que certains vaisseaux spatiaux. Peu nombreux dans tout l'Empire, déployés uniquement pour des missions stratégiquement critiques. L'exosquelette prototype Gen-7 fournit des bonus massifs : stats, résistances, Flux, et affinités. Sans l'exo, l'Opale reste formidable (~5000 pts) mais vulnérable. Mentionnés dans les rapports de guerre comme exemple de la supériorité tactique impériale."
