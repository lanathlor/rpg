name: Commandante de la Résistance
type: Leader / Commandante
faction: Résistance anti-impériale
alignement: Variable (souvent chaotique)
description: Commandante charismatique d'une cellule de résistance. Tacticienne brillante et tireuse d'élite. Leader expérimentée avec formation militaire complète. Prête à prendre des décisions difficiles pour la cause.
