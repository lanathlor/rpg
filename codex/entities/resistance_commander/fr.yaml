gameplay_guide: "Commandante de résistance : leader tactique et tireuse d'élite. Tacticienne exceptionnelle avec +2 Initiative et capacité de coordonner alliés. Tir de précision donne +3 aux jets de Précision. Combat à distance, reste en arrière avec protection (gardes du corps). Haute Dextérité et Précision (16) pour tirs mortels. Leadership inspire les alliés. ~230 points."
notes: "Archétype pour commandantes de la résistance. Peut être personnalisée avec nom, motivations et équipement spécial selon scénario (ex: détonateur, communicateur encrypté, etc.)."
