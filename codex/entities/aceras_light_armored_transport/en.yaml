gameplay_guide: |
  Heavy vehicle with armor (RMEC 8). Dangerous plasma cannon (3d8+4 RRAD area).

  TACTICS:
  - Priority: destroy the vehicle to prevent transport and neutralize the cannon
  - Weak points: treads/wheels (immobilization), turret (weapon disabling), fuel tank
  - Can transport 8 soldiers - prevent disembarkation or target them after they dismount

  COUNTERMEASURES:
  - Targeted explosives on weak points
  - Flank attacks (weaker rear armor)
  - EMP or alteration spells on electronic systems
