gameplay_guide: Garde d'élite spécialisé dans la surveillance de zones sensibles et d'objets de haute valeur. Très haute perception et équipé pour détecter les intrusions à distance. L'exosquelette de combat offre une excellente protection tout en maintenant la mobilité. Préfère neutraliser les menaces à distance avant qu'elles n'approchent de sa zone de garde.
