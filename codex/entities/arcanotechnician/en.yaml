gameplay_guide: Scientist specializing in arcanotechnology. High Intelligence and good Flux reserves. Prefers using spells and analysis over direct combat. Vulnerable in melee. Arcanotechnician and Scientist skills provide expertise for manipulating crystals and systems. Can disable or hack arcanotechnological installations.
