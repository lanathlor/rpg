gameplay_guide: Combattant de résistance avec formation militaire basique. Utilise couverture et tactiques de guérilla. Moins discipliné que les soldats impériaux mais motivé par sa cause. Préfère le combat à distance. Fuit si débordé ou isolé. Dangereux en groupe coordonné.
